<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-label="推測を測ってから言う流れの図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,45%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,45%)"/></linearGradient>
<marker id="i3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="20" width="170" height="52" rx="10" fill="url(#i2)"/><text x="95" y="52" fill="#fff" font-size="14" text-anchor="middle">「〜のはず」(推測)</text>
<rect x="225" y="20" width="170" height="52" rx="10" fill="url(#i1)"/><text x="310" y="52" fill="#fff" font-size="14" text-anchor="middle">実測する</text>
<rect x="440" y="20" width="170" height="52" rx="10" fill="url(#i1)"/><text x="525" y="52" fill="#fff" font-size="14" text-anchor="middle">測った値を言う</text>
<path d="M180 46 H223" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i3)"/>
<path d="M395 46 H438" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i3)"/>
<text x="310" y="108" fill="#4a5568" font-size="13" text-anchor="middle">測れないときは「見込み (確かめていない)」「数えていない」と書く</text>
<text x="310" y="132" fill="#a51f22" font-size="13" text-anchor="middle">測らずに「無い」「0 件」「直した」と言い切らない</text>
</svg>
