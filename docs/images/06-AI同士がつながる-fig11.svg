<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" width="620" height="190" role="img" aria-label="通知を読み切り、数えて、黙って張り直す図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(93,78%,25%)"/><stop offset="1" stop-color="hsl(93,58%,45%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(186,78%,25%)"/><stop offset="1" stop-color="hsl(186,58%,45%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="6" y="20" width="140" height="56" rx="10" fill="url(#i2)"/><text x="76" y="44" fill="#fff" font-size="13" text-anchor="middle">① 終了の通知</text><text x="76" y="62" fill="#fff" font-size="12" text-anchor="middle">理由は区別しない</text>
<rect x="166" y="20" width="140" height="56" rx="10" fill="url(#i2)"/><text x="236" y="44" fill="#fff" font-size="13" text-anchor="middle">② 出力を読み切る</text><text x="236" y="62" fill="#fff" font-size="12" text-anchor="middle">発言があれば返信</text>
<rect x="326" y="20" width="140" height="56" rx="10" fill="url(#i2)"/><text x="396" y="44" fill="#fff" font-size="13" text-anchor="middle">③ 数える</text><text x="396" y="62" fill="#fff" font-size="12" text-anchor="middle">aichat waiters</text>
<rect x="486" y="20" width="128" height="56" rx="10" fill="url(#i1)"/><text x="550" y="44" fill="#fff" font-size="13" text-anchor="middle">④ 黙って張り直す</text><text x="550" y="62" fill="#fff" font-size="12" text-anchor="middle">報告は要らない</text>
<path d="M146 48 H164" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M306 48 H324" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M466 48 H484" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<rect x="60" y="108" width="500" height="64" rx="10" fill="url(#i3)"/><text x="310" y="132" fill="#fff" font-size="13" text-anchor="middle">失敗の通知を、応答の要らない通知として流さない</text><text x="310" y="152" fill="#fff" font-size="13" text-anchor="middle">待受け中は、答えが来るまで止まるツール (AskUserQuestion) を使わない</text>
</svg>
