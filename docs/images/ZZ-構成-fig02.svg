<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" aria-label="01 から 07 は規模が大きくなる順、08 と 09 は別枠の図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,45%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="6" y="14" width="196" height="64" rx="10" fill="url(#i1)"/><text x="104" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1 人で使う</text><text x="104" y="62" fill="#fff" font-size="12" text-anchor="middle">01・02・03</text>
<rect x="212" y="14" width="196" height="64" rx="10" fill="url(#i2)"/><text x="310" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">課題・決定・ルールの共有</text><text x="310" y="62" fill="#fff" font-size="12" text-anchor="middle">04・05</text>
<rect x="418" y="14" width="196" height="64" rx="10" fill="url(#i3)"/><text x="516" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">複数のセッション</text><text x="516" y="62" fill="#fff" font-size="12" text-anchor="middle">06・07</text>
<rect x="110" y="94" width="400" height="64" rx="10" fill="url(#i4)"/><text x="310" y="122" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">別枠: 仕組みで守る (08)・画面を持つアプリ (09)</text><text x="310" y="142" fill="#fff" font-size="12" text-anchor="middle">どの規模でも、必要になったときに読む</text>
</svg>
