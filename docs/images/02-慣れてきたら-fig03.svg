<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" width="620" height="190" role="img" aria-label="実行になる言葉と、実行にならない言葉の図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,45%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="10" width="290" height="34" rx="8" fill="url(#i1)"/><text x="155" y="32" fill="#fff" font-size="15" text-anchor="middle">実行になる言葉</text>
<rect x="320" y="10" width="290" height="34" rx="8" fill="url(#i2)"/><text x="465" y="32" fill="#fff" font-size="15" text-anchor="middle">実行にならない言葉</text>
<text x="155" y="72" fill="#1c2330" font-size="14" text-anchor="middle">反映して・更新して・追加して</text>
<text x="155" y="96" fill="#1c2330" font-size="14" text-anchor="middle">作って・書いて・開いて</text>
<text x="155" y="120" fill="#1c2330" font-size="14" text-anchor="middle">削除して・消して・戻して</text>
<text x="155" y="144" fill="#1c2330" font-size="14" text-anchor="middle">commit して・push して</text>
<text x="155" y="164" fill="#4a5568" font-size="12" text-anchor="middle">ほか: 作成して・amend して・送って・公開して・投稿して</text>
<text x="465" y="72" fill="#1c2330" font-size="14" text-anchor="middle">決める・決定</text>
<text x="465" y="96" fill="#1c2330" font-size="14" text-anchor="middle">OK・進めて・やって</text>
<text x="465" y="120" fill="#1c2330" font-size="14" text-anchor="middle">その案で</text>
<rect x="320" y="132" width="290" height="38" rx="8" fill="url(#i3)"/><text x="465" y="156" fill="#fff" font-size="13" text-anchor="middle">方針の合意。実行の許可ではない</text>
</svg>
