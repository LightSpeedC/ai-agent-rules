<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="選択肢の番号を、会話をまたいで重ならないように振る図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(186,78%,25%)"/><stop offset="1" stop-color="hsl(186,58%,45%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="14" width="290" height="46" rx="10" fill="url(#i1)"/><text x="155" y="42" fill="#fff" font-size="14" text-anchor="middle">記憶で番号を書く → 取り違え</text>
<rect x="320" y="14" width="290" height="46" rx="10" fill="url(#i2)"/><text x="465" y="42" fill="#fff" font-size="14" text-anchor="middle">道具で番号を取る (<tspan font-family="Consolas, monospace">issue choice next</tspan>)</text>
<path d="M465 60 V82" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<text x="465" y="102" fill="#1c2330" font-size="14" text-anchor="middle">別のセッションをまたいでも重ならない</text>
<rect x="10" y="124" width="600" height="60" rx="10" fill="url(#i3)"/>
<text x="310" y="150" fill="#fff" font-size="14" text-anchor="middle">案を出す前に、その直前の 1 行へ「課題番号と題」を書く。推す案を A に。なぜ推すかを 1 行添える</text>
<text x="310" y="171" fill="#fff" font-size="13" text-anchor="middle">恒久対策と暫定対策は分けて書く。「何もしない」は案に混ぜない</text>
</svg>
