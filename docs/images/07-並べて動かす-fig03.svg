<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="メインの AI が作り、別のセッションがレビューする、実装の前後の流れの図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(186,78%,25%)"/><stop offset="1" stop-color="hsl(186,58%,45%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(93,78%,25%)"/><stop offset="1" stop-color="hsl(93,58%,45%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="6" y="20" width="140" height="56" rx="10" fill="url(#i1)"/><text x="76" y="44" fill="#fff" font-size="13" text-anchor="middle">前のレビュー</text><text x="76" y="62" fill="#fff" font-size="12" text-anchor="middle">課題・計画の漏れ</text>
<rect x="166" y="20" width="140" height="56" rx="10" fill="url(#i2)"/><text x="236" y="44" fill="#fff" font-size="13" text-anchor="middle">メインが実装する</text><text x="236" y="62" fill="#fff" font-size="12" text-anchor="middle">画面は、自分で見る</text>
<rect x="326" y="20" width="140" height="56" rx="10" fill="url(#i1)"/><text x="396" y="44" fill="#fff" font-size="13" text-anchor="middle">後のレビュー</text><text x="396" y="62" fill="#fff" font-size="12" text-anchor="middle">ソース (試験の前)</text>
<rect x="486" y="20" width="128" height="56" rx="10" fill="url(#i3)"/><text x="550" y="44" fill="#fff" font-size="13" text-anchor="middle">試験を流す</text><text x="550" y="62" fill="#fff" font-size="12" text-anchor="middle">結果を報告</text>
<path d="M146 48 H164" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M306 48 H324" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M466 48 H484" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<rect x="60" y="112" width="500" height="70" rx="10" fill="url(#i1)"/><text x="310" y="136" fill="#fff" font-size="13" text-anchor="middle">レビューするセッションは、読むだけ。実行・試験・ファイルの変更をしない</text><text x="310" y="156" fill="#fff" font-size="13" text-anchor="middle">指摘は、強く疑えるもの (⚠️) と推測に分けて、場所と直し方の案を付けて返す</text><text x="310" y="174" fill="#fff" font-size="12" text-anchor="middle">返った指摘は、メインが 1 件ずつ、起きうるか・直すべきかを確かめる</text>
</svg>
