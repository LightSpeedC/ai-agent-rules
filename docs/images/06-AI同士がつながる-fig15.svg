<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="周知は見出し名と変わった点だけを書く図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(93,78%,25%)"/><stop offset="1" stop-color="hsl(93,58%,45%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="14" width="290" height="70" rx="10" fill="url(#i1)"/><text x="155" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">本文を貼る</text><text x="155" y="64" fill="#fff" font-size="12" text-anchor="middle">古くなる。古い本文が、正しく読まれる</text>
<rect x="320" y="14" width="290" height="70" rx="10" fill="url(#i2)"/><text x="465" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">見出し名 ＋ 変わった点</text><text x="465" y="64" fill="#fff" font-size="12" text-anchor="middle">数行。読み手が本文を読みに行く</text>
<rect x="10" y="104" width="600" height="82" rx="10" fill="url(#i3)"/><text x="310" y="128" fill="#fff" font-size="13" text-anchor="middle">送る前に、案 (ルーム・名乗る ID・宛先) を見せて、確認をもらう</text><text x="310" y="148" fill="#fff" font-size="13" text-anchor="middle">発言番号は、コードの囲み (<tspan font-family="Consolas, monospace">`#9999`</tspan>) で書く。囲まないと、GitHub の番号に化ける</text><text x="310" y="168" fill="#fff" font-size="13" text-anchor="middle">時刻・件数は、送る直前に測った値を写す</text>
</svg>
