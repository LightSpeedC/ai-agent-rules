<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" aria-label="書いた資料を、レビュー専用のセッションに読んでもらってから利用者に見せる図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,45%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="20" width="150" height="56" rx="10" fill="url(#i1)"/><text x="85" y="54" fill="#fff" font-size="14" text-anchor="middle">資料を書く</text>
<rect x="235" y="20" width="170" height="56" rx="10" fill="url(#i2)"/><text x="320" y="46" fill="#fff" font-size="14" text-anchor="middle">レビュー専用の</text><text x="320" y="66" fill="#fff" font-size="14" text-anchor="middle">別のセッション</text>
<rect x="480" y="20" width="130" height="56" rx="10" fill="url(#i3)"/><text x="545" y="54" fill="#fff" font-size="14" text-anchor="middle">利用者に見せる</text>
<path d="M160 48 H233" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M405 48 H478" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<text x="320" y="112" fill="#1c2330" font-size="14" text-anchor="middle">漏れ・食い違い・古い記述・根拠のない断定・番号や数の誤りを見る</text>
<text x="320" y="138" fill="#4a5568" font-size="13" text-anchor="middle">指摘は、強く疑えるもの (⚠️) と推測に分けて返る。直したら、見せる前にもう一度</text>
</svg>
