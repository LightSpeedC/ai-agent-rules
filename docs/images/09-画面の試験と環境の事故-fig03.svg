<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="人の操作に合わせた、マウスの押し方の図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(93,78%,25%)"/><stop offset="1" stop-color="hsl(93,58%,45%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="14" width="290" height="70" rx="10" fill="url(#i1)"/><text x="155" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">押してすぐ離す</text><text x="155" y="64" fill="#fff" font-size="12" text-anchor="middle">通り続けて、壊れたまま 10 日ほど</text>
<rect x="320" y="14" width="290" height="70" rx="10" fill="url(#i2)"/><text x="465" y="42" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">押してから、間を置いて離す</text><text x="465" y="64" fill="#fff" font-size="12" text-anchor="middle">人のクリックは 100〜200 ミリ秒</text>
<rect x="10" y="104" width="600" height="82" rx="10" fill="url(#i3)"/><text x="310" y="128" fill="#fff" font-size="13" text-anchor="middle">時間とずれは、毎回ランダムに決める。使った値を、試験の記録に出す</text><text x="310" y="148" fill="#fff" font-size="13" text-anchor="middle">欄とボタンは、1 か所でなく、複数の位置で押す (左端・文字の上・右の空き)</text><text x="310" y="168" fill="#fff" font-size="12" text-anchor="middle">すぐ離す書き方が、試験のファイルに無いことを検査する</text>
</svg>
