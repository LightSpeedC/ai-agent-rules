<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="フックが英語の文を止め、訳を書いてから通す図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(93,78%,25%)"/><stop offset="1" stop-color="hsl(93,58%,45%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="6" y="20" width="140" height="56" rx="10" fill="url(#i1)"/><text x="76" y="44" fill="#fff" font-size="13" text-anchor="middle">AI が道具を呼ぶ</text><text x="76" y="62" fill="#fff" font-size="12" text-anchor="middle">直前に英語の文</text>
<rect x="196" y="20" width="140" height="56" rx="10" fill="url(#i2)"/><text x="266" y="44" fill="#fff" font-size="13" text-anchor="middle">フックが止める</text><text x="266" y="62" fill="#fff" font-size="12" text-anchor="middle">理由に英文を引用</text>
<rect x="386" y="20" width="140" height="56" rx="10" fill="url(#i3)"/><text x="456" y="44" fill="#fff" font-size="13" text-anchor="middle">日本語訳を書く</text><text x="456" y="62" fill="#fff" font-size="12" text-anchor="middle">本文に書いてから</text>
<path d="M146 48 H194" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M336 48 H384" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M526 48 H556 V100" fill="none" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<rect x="476" y="102" width="138" height="40" rx="10" fill="url(#i3)"/><text x="545" y="127" fill="#fff" font-size="13" text-anchor="middle">呼び直すと通る</text>
<rect x="10" y="130" width="440" height="56" rx="10" fill="url(#i1)"/><text x="230" y="154" fill="#fff" font-size="13" text-anchor="middle">止めるのは、事故。書く癖そのものは、フックでは直らない</text><text x="230" y="174" fill="#fff" font-size="12" text-anchor="middle">だから、止めた回数を数えて、ルールの側も見直す</text>
</svg>
