<path d="M140 62 H168" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i2)"/>
<path d="M300 62 H328" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i2)"/>
<path d="M460 62 H488" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i2)"/>
<path d="M550 94 Q550 134 310 134 Q70 134 75 98" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#i2)"/>
<text x="310" y="124" fill="#4a5568" font-size="12" text-anchor="middle">それでも破られたら、次の失敗として数える</text>
