<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="620" height="150" role="img" aria-label="失敗してルールを足し、次から防げる流れの図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<marker id="i2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="30" width="130" height="64" rx="10" fill="url(#i1)"/><text x="75" y="68" fill="#fff" font-size="16" text-anchor="middle">失敗する</text>
<rect x="170" y="30" width="130" height="64" rx="10" fill="url(#i1)"/><text x="235" y="68" fill="#fff" font-size="16" text-anchor="middle">原因を調べる</text>
