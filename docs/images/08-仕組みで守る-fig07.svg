<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="編集が失敗したままなら、commit を止める図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(186,78%,25%)"/><stop offset="1" stop-color="hsl(186,58%,45%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(93,78%,25%)"/><stop offset="1" stop-color="hsl(93,58%,45%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="6" y="20" width="140" height="56" rx="10" fill="url(#i1)"/><text x="76" y="44" fill="#fff" font-size="13" text-anchor="middle">Edit が失敗</text><text x="76" y="62" fill="#fff" font-size="12" text-anchor="middle">失敗したまま</text>
<rect x="196" y="20" width="140" height="56" rx="10" fill="url(#i2)"/><text x="266" y="44" fill="#fff" font-size="13" text-anchor="middle">git commit を呼ぶ</text><text x="266" y="62" fill="#fff" font-size="12" text-anchor="middle">フックが会話を読む</text>
<rect x="386" y="20" width="228" height="56" rx="10" fill="url(#i1)"/><text x="500" y="44" fill="#fff" font-size="13" text-anchor="middle">止める</text><text x="500" y="62" fill="#fff" font-size="12" text-anchor="middle">理由にファイル名と解き方</text>
<path d="M146 48 H194" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M336 48 H384" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<rect x="60" y="104" width="500" height="40" rx="10" fill="url(#i3)"/><text x="310" y="129" fill="#fff" font-size="13" text-anchor="middle">解き方: 同じファイルを直して、Edit・Write か Read が通ると、印が解ける</text>
<text x="310" y="170" fill="#4a5568" font-size="13" text-anchor="middle">Edit・Write と git commit を、同じ応答に並べない。結果を見てから、次の応答で</text>
</svg>
