<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-label="失敗の報告に書く 3 つのことの図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<marker id="i3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="20" width="170" height="64" rx="10" fill="url(#i1)"/><text x="95" y="48" fill="#fff" font-size="14" text-anchor="middle">① 何をしたか</text><text x="95" y="68" fill="#fff" font-size="12" text-anchor="middle">実行した操作</text>
<rect x="225" y="20" width="170" height="64" rx="10" fill="url(#i1)"/><text x="310" y="48" fill="#fff" font-size="14" text-anchor="middle">② いまどうなっているか</text><text x="310" y="68" fill="#fff" font-size="12" text-anchor="middle">変わった物・件数・状態</text>
<rect x="440" y="20" width="170" height="64" rx="10" fill="url(#i1)"/><text x="525" y="48" fill="#fff" font-size="14" text-anchor="middle">③ 選べる直し方</text><text x="525" y="68" fill="#fff" font-size="12" text-anchor="middle">戻す・進める・別の形</text>
<path d="M180 52 H223" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i3)"/>
<path d="M395 52 H438" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i3)"/>
<rect x="150" y="108" width="320" height="38" rx="10" fill="url(#i2)"/><text x="310" y="132" fill="#fff" font-size="14" text-anchor="middle">選ぶのは、利用者。急いで消さない</text>
<path d="M525 84 V108 H470" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#i3)"/>
</svg>
