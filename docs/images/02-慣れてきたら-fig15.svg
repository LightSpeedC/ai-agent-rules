<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" aria-label="流す前に見込みを出し、見張り、倍を超えたら止める流れの図" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(25,78%,25%)"/><stop offset="1" stop-color="hsl(25,58%,45%)"/></linearGradient>
<marker id="i4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4a5568"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="10" y="20" width="170" height="64" rx="10" fill="url(#i2)"/><text x="95" y="48" fill="#fff" font-size="14" text-anchor="middle">流す前に</text><text x="95" y="68" fill="#fff" font-size="12" text-anchor="middle">開始時刻と見込みを出す</text>
<rect x="225" y="20" width="170" height="64" rx="10" fill="url(#i2)"/><text x="310" y="48" fill="#fff" font-size="14" text-anchor="middle">流している間</text><text x="310" y="68" fill="#fff" font-size="12" text-anchor="middle">経過・CPU・成果物を見る</text>
<rect x="440" y="20" width="170" height="64" rx="10" fill="url(#i3)"/><text x="525" y="48" fill="#fff" font-size="14" text-anchor="middle">見込みの倍を超えたら</text><text x="525" y="68" fill="#fff" font-size="12" text-anchor="middle">止めて、原因を調べる</text>
<path d="M180 52 H223" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<path d="M395 52 H438" stroke="#4a5568" stroke-width="2.5" marker-end="url(#i4)"/>
<rect x="110" y="110" width="400" height="40" rx="10" fill="url(#i1)"/><text x="310" y="136" fill="#fff" font-size="13" text-anchor="middle">終了コード 0・「完了」の表示は、成功の証拠にしない</text>
</svg>
